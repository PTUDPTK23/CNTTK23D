# Docker Compose - Hệ thống thư viện và đặt mượn sách phân tán
# Khởi chạy: docker-compose up --build

services:
  # ============ PostgreSQL Database ============
  postgres:
    image: postgres:17-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: librarydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - library-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============ RabbitMQ Message Broker ============
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: library-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ============ Library API Service ============
  library-api:
    build:
      context: .
      dockerfile: src/LibraryApi/Dockerfile
    container_name: library-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=librarydb;Username=postgres;Password=postgres123"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - library-network
    restart: on-failure

  # ============ Reservation Worker Service ============
  reservation-worker:
    build:
      context: .
      dockerfile: src/ReservationWorker/Dockerfile
    container_name: reservation-worker
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=librarydb;Username=postgres;Password=postgres123"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - library-network
    restart: on-failure

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  library-network:
    driver: bridge
